<!DOCTYPE html>
<html lang="en"></html>
<head>
    <title> Bliss Doughnuts</title>
    <link rel="stylesheet" href="style.css">

</head>
<body> 
    <div class="brand">
        <a href="index.html">Bliss Doughnuts|Taste The Love</a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="order.html">Order</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
<main class="order-container">
  <h1>Order and Delivery</h1>
  <p class="subtitle">Review your cart, choose your delivery details and complete your order in just a few clicks.</p>

  <form>
    <div class="card">
      <h4>Recipient and address</h4>
      <label>Recipients full name</label>
      <input type="text" name="full_name" placeholder="e.g. John Doe" required>

      <label>Recipients contact details</label>
      <input type="tel" name="contact" placeholder="083 123 4567" required>

      <label>Delivery address</label>
      <input type="text" name="delivery_address" required>

      <label>Delivery area</label>
      <input type="text" name="delivery_area" placeholder="e.g. Johannesburg">
    </div>

    <div class="card">
      <h4>Delivery date and time</h4>
      <label>Delivery date</label>
      <input type="date" name="delivery_date" required>

      <label>Delivery time</label>
      <input type="time" name="delivery_time">
    </div>

    <div class="card">
      <h4>Personal message</h4>
      <label>Messages (optional)</label>
      <textarea name="message" rows="3" placeholder="Happy Birthday..."></textarea>
    </div>

    <div class="card">
      <h4>Payment method</h4>
      <label class="radio"><input type="radio" name="payment" value="payfast"> Debit or Credit card with Payfast</label>
      <label class="radio"><input type="radio" name="payment" value="cod"> Cash on Delivery</label>
    </div>

    <label class="checkbox">
      <input type="checkbox" required> I agree to the T's & C's, refund and delivery conditions of Bliss Doughnuts
    </label>

    <button type="submit" class="order-btn">Place Order</button>
  </form>
</main>

</body>
</html>
